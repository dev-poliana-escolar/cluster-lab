services:

  redis:
    image: redis:7-alpine
    container_name: juicefs-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - juicefs

  minio:
    image: minio/minio:latest
    container_name: juicefs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - juicefs

  minio-init:
    image: minio/mc:latest
    container_name: juicefs-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/juicefs;
      exit 0;
      "
    networks:
      - juicefs

  juicefs-format:
    image: juicedata/mount:latest
    container_name: juicefs-format
    depends_on:
      - redis
      - minio-init
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      juicefs format
      --storage s3
      --bucket http://minio:9000/juicefs
      --access-key minioadmin
      --secret-key minioadmin123
      redis://redis:6379/1
      demo
      || true;
      exit 0;
      "
    networks:
      - juicefs

  node1:
    image: juicedata/mount:latest
    container_name: juicefs-node1
    depends_on:
      - juicefs-format
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data/node1:/mnt
    command:
      [
        "juicefs",
        "mount",
        "redis://redis:6379/1",
        "/mnt",
        "--foreground"
      ]
    networks:
      - juicefs

  node2:
    image: juicedata/mount:latest
    container_name: juicefs-node2
    depends_on:
      - juicefs-format
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data/node2:/mnt
    command:
      [
        "juicefs",
        "mount",
        "redis://redis:6379/1",
        "/mnt",
        "--foreground"
      ]
    networks:
      - juicefs

  node3:
    image: juicedata/mount:latest
    container_name: juicefs-node3
    depends_on:
      - juicefs-format
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data/node3:/mnt
    command:
      [
        "juicefs",
        "mount",
        "redis://redis:6379/1",
        "/mnt",
        "--foreground"
      ]
    networks:
      - juicefs

networks:
  juicefs:

volumes:
  redis-data:
  minio-data: