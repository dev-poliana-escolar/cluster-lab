services:
  redis:
    image: redis:7-alpine
    container_name: juicefs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - juicefs

  minio:
    image: quay.io/minio/minio:latest
    container_name: juicefs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - juicefs

  node1:
    image: juicedata/mount:ce-v1.3.1
    container_name: juicefs-node1
    privileged: true
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    volumes:
      - type: bind
        source: ./data/node1
        target: /mnt/juicefs
        bind:
          propagation: shared
    command: >
      juicefs mount
      redis://redis:6379/1
      /mnt/juicefs
      -f
    networks:
      - juicefs

  node2:
    image: juicedata/mount:ce-v1.3.1
    container_name: juicefs-node2
    privileged: true
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    volumes:
      - type: bind
        source: ./data/node2
        target: /mnt/juicefs
        bind:
          propagation: shared
    command: >
      juicefs mount
      redis://redis:6379/1
      /mnt/juicefs
      -f
    networks:
      - juicefs

  node3:
    image: juicedata/mount:ce-v1.3.1
    container_name: juicefs-node3
    privileged: true
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    volumes:
      - type: bind
        source: ./data/node3
        target: /mnt/juicefs
        bind:
          propagation: shared
    command: >
      juicefs mount
      redis://redis:6379/1
      /mnt/juicefs
      -f
    networks:
      - juicefs

networks:
  juicefs:
    driver: bridge